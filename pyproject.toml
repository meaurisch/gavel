[project]
name = "gavel"
version = "0.2.0"
description = "gavel — blind pairwise benchmarking for agentic coding setups (formerly setup-bench)"
requires-python = ">=3.12"

[project.scripts]
gavel = "cli:app"
setup-bench = "cli:app"   # legacy alias

[tool.setuptools]
py-modules = ["cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: requires external tools (claude CLI, network access)",
]
