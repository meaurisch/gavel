[project]
name = "setup-bench"
version = "0.1.0"
requires-python = ">=3.12"

[project.scripts]
setup-bench = "cli:app"

[tool.setuptools]
py-modules = ["cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: requires external tools (claude CLI, network access)",
]
