instruction: |
  Add a ReplaceGroup local-search operator to pyvrp.search. The operator should improve solutions for VRP variants with mutually-exclusive client groups by finding better placements for entire groups within routes. Implement the operator in C++, expose it via pybind11 bindings, register it in LocalSearch, and make it available from the Python search module.
