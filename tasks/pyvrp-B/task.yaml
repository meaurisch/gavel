id: pyvrp-B
repo_url: https://github.com/PyVRP/PyVRP
# base_commit is a LOCAL commit rebuilt deterministically by `python cli.py setup`:
# upstream 609bf08a41771810b046cc34968e581763059c3a with reference.diff
# reverse-applied (fixed author/date => same sha on every machine).
base_commit: d9a1b2cd257ab04e4ec234a970680260c4f528ee
instruction: |
  The local-search framework only has binary operators today — every operator
  exchanges segments between two routes. That leaves a whole class of
  single-route improvements unreachable: we can't drop an optional client whose
  prize doesn't justify its detour, and we can't clean up a redundant reload
  depot left sitting between two consecutive trips. Both situations come up
  routinely on prize-collecting and multi-trip instances, and right now the only
  way out of them is a full re-solve.

  Add unary-operator support to local search. Introduce a `UnaryOperator` base
  that evaluates and applies a move on a single route, then implement two
  concrete operators on top of it:
    - `RemoveOptional` — removes an optional client from its route when doing so
      lowers cost (i.e. the prize is not worth the detour).
    - `RemoveAdjacentDepot` — removes an unnecessary reload depot between two
      route segments when doing so lowers cost.
  Wire both through the whole stack: implement in the C++ search core, expose
  them via the pybind11 bindings, register them in LocalSearch, and export them
  from the Python `pyvrp.search` module.
run_cmd: "pytest tests/search/test_RemoveOptional.py tests/search/test_RemoveAdjacentDepot.py -v"
held_out_tests_path: tasks/pyvrp-B/held_out_tests
reference_diff_path: tasks/pyvrp-B/reference.diff
build_cmd: "pip install -e . 2>&1"
visible_test_cmd: null
# Pre-calibration estimate (label by hand after a calibration sweep). hard:
