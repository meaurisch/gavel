id: D6
repo: vault-mcp-server
repo_url: https://github.com/meaurisch/vault-mcp-server
# base_commit is a LOCAL synthesized commit rebuilt deterministically by
# `python cli.py setup`: the bare pinned anchor tree, as an orphan lineage in a
# sanitized repo. See tasks/_repo_setup/repos.lock.yaml.
base_commit: 6ea6823aaed8a4c2f9d62027f09d7115ead1bc79
instruction: |
  Claude Code starts in this repo with no project instructions: the agent guide lives in
  `AGENTS.md`, which Codex and Gemini load automatically and Claude Code does not, so a
  Claude session here begins with none of this repo's conventions in context. Make Claude
  Code load the same guide as the other CLIs, without creating a second copy of the guide
  that can drift. Add a test that asserts it. Work as a normal session on this checkout:
  commit your work as you go, and finish by writing PR_BODY.md in the repo root containing
  the pull-request description you would open for this change.
run_cmd: "python tests/run_hidden.py"
# `npm ci` (not `npm install`): it never rewrites package-lock.json, so the
# build step cannot perturb the diff the DECISION checker reads. --ignore-scripts
# skips better-sqlite3's node-gyp rebuild, which needs a Visual Studio C++
# toolchain this host does not have; the full vitest suite is green without it.
# Nothing here is an editable pip install, so core.toolchain.needs_wsl stays
# False and the whole task runs natively on Windows.
build_cmd: "npm ci --ignore-scripts --no-audit --no-fund"
# The repo's whole vitest suite (22 files / 240 tests, ~11s) is green on the
# base once the build step has run, so there is nothing to scope down.
visible_test_cmd: "npx vitest run"
held_out_tests_path: tasks/D6/held_out_tests
reference_diff_path: tasks/D6/reference.diff
# Pre-calibration estimate (label by hand after a sweep): two small files, but
# pointer-vs-copy is the judgement call being measured.
difficulty: medium
