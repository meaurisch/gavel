<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>setup-bench grading</title>
  <link rel="stylesheet" href="/static/vendor/diff2html.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      min-height: 100vh;
    }

    .hidden { display: none !important; }

    /* ── Progress bar ────────────────────────────────── */
    #progress-bar-track {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 3px;
      background: #2a2a4a;
      z-index: 100;
    }
    #progress-bar-fill {
      height: 100%;
      background: #4a9eff;
      width: 0%;
      transition: width 0.3s ease;
    }

    /* ── Phase 1: Select ─────────────────────────────── */
    #select-phase {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 1.5rem;
    }
    #select-phase h1 {
      font-size: 2rem;
      font-weight: 300;
      color: #e0e0e0;
      margin-bottom: 1rem;
    }
    #select-phase select,
    #select-phase button {
      font-size: 1rem;
      padding: 0.6rem 1.2rem;
      border-radius: 4px;
      border: 1px solid #444;
      background: #2a2a4a;
      color: #e0e0e0;
      min-width: 260px;
      cursor: pointer;
    }
    #select-phase select:focus,
    #select-phase button:focus {
      outline: 2px solid #4a9eff;
      outline-offset: 2px;
    }
    #start-btn {
      background: #4a9eff !important;
      border-color: #4a9eff !important;
      font-weight: 600;
    }
    #start-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed !important;
    }
    #empty-message {
      color: #888;
      font-size: 1rem;
    }

    /* ── Phase 2: Compare ────────────────────────────── */
    #compare-phase {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* Progress header */
    .progress-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.6rem 1.5rem;
      font-size: 0.9rem;
      color: #aaa;
      border-bottom: 1px solid #2a2a4a;
      flex-shrink: 0;
    }
    .progress-header .pair-label { font-weight: 600; color: #e0e0e0; }
    .progress-pct { color: #888; }

    /* Side-by-side columns */
    .diff-columns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      flex: 1;
      min-height: 0;
    }
    .diff-side {
      display: flex;
      flex-direction: column;
      border-right: 1px solid #2a2a4a;
      min-height: 0;
    }
    .diff-side:last-child { border-right: none; }

    .side-header {
      text-align: center;
      padding: 0.5rem 0 0.2rem;
      flex-shrink: 0;
    }
    .label {
      font-size: 3rem;
      font-weight: bold;
      text-align: center;
      line-height: 1;
    }
    .proxy {
      font-size: 0.85rem;
      color: #888;
      text-align: center;
      padding-bottom: 0.4rem;
    }

    .diff-container {
      flex: 1;
      overflow-y: auto;
      padding: 0 0.5rem;
      min-height: 0;
    }
    .diff-container .no-changes {
      color: #666;
      text-align: center;
      padding: 3rem 1rem;
      font-style: italic;
    }

    /* ── Action bar ──────────────────────────────────── */
    .action-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 1rem;
      padding: 0.8rem 1rem;
      border-top: 1px solid #2a2a4a;
      flex-shrink: 0;
    }
    .action-bar .prompt {
      color: #aaa;
      font-size: 0.9rem;
      margin-right: 0.5rem;
    }

    .choice-btn {
      padding: 0.5rem 2rem;
      border: 2px solid #555;
      border-radius: 4px;
      cursor: pointer;
      font-size: 1.1rem;
      background: transparent;
      color: #e0e0e0;
      transition: all 0.15s ease;
    }
    .choice-btn:hover { border-color: #888; }
    .choice-btn:focus { outline: 2px solid #4a9eff; outline-offset: 2px; }

    .choice-btn[data-choice="A"].active {
      background: rgba(74, 222, 128, 0.2);
      border-color: #4ade80;
      color: #4ade80;
    }
    .choice-btn[data-choice="B"].active {
      background: rgba(244, 114, 182, 0.2);
      border-color: #f472b6;
      color: #f472b6;
    }
    .choice-btn[data-choice="tie"].active {
      background: rgba(251, 191, 36, 0.2);
      border-color: #fbbf24;
      color: #fbbf24;
    }

    /* Flash effect on choose */
    .choice-btn.flash-a { background: rgba(74, 222, 128, 0.5); }
    .choice-btn.flash-b { background: rgba(244, 114, 182, 0.5); }
    .choice-btn.flash-tie { background: rgba(251, 191, 36, 0.5); }

    .nav-hints {
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      padding: 0.3rem 1rem 0.6rem;
      flex-shrink: 0;
    }
    .nav-hint {
      color: #666;
      font-size: 0.8rem;
    }
    .nav-hint kbd {
      background: #2a2a4a;
      border: 1px solid #444;
      border-radius: 3px;
      padding: 0.1rem 0.4rem;
      font-family: inherit;
      font-size: 0.75rem;
    }

    /* ── Rubric panel ────────────────────────────────── */
    #rubric-panel {
      display: flex;
      justify-content: center;
      gap: 1rem;
      padding: 0.5rem 1rem;
      border-top: 1px solid #2a2a4a;
      background: #1e1e36;
      flex-shrink: 0;
    }
    .rubric-field {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
    }
    .rubric-field label {
      font-size: 0.75rem;
      color: #888;
    }
    .rubric-field input {
      background: #2a2a4a;
      border: 1px solid #444;
      border-radius: 3px;
      color: #e0e0e0;
      padding: 0.3rem 0.5rem;
      font-size: 0.85rem;
      width: 160px;
    }
    .rubric-field input:focus {
      outline: 1px solid #4a9eff;
      border-color: #4a9eff;
    }

    /* ── Phase 3: Reveal ─────────────────────────────── */
    #reveal-phase {
      padding: 2rem;
      max-width: 800px;
      margin: 0 auto;
    }
    #reveal-phase h1 {
      font-size: 1.6rem;
      font-weight: 300;
      margin-bottom: 1.5rem;
    }
    #reveal-phase h2 {
      font-size: 1.1rem;
      font-weight: 600;
      margin: 1.5rem 0 0.5rem;
      color: #aaa;
    }

    .reveal-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 1rem;
    }
    .reveal-table th,
    .reveal-table td {
      text-align: left;
      padding: 0.5rem 0.8rem;
      border-bottom: 1px solid #2a2a4a;
    }
    .reveal-table th {
      color: #888;
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
    }
    .reveal-table td { font-size: 0.95rem; }
    .reveal-table tr:hover td { background: rgba(74, 158, 255, 0.05); }

    #grade-another-btn {
      margin-top: 2rem;
      padding: 0.6rem 1.5rem;
      background: #4a9eff;
      border: none;
      border-radius: 4px;
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
      font-weight: 600;
    }
    #grade-another-btn:hover { opacity: 0.9; }

    /* ── diff2html dark overrides ─────────────────────── */
    .d2h-wrapper { background: transparent !important; }
    .d2h-file-header { background: #2a2a4a !important; color: #e0e0e0 !important; }
    .d2h-code-line { background: #1e1e3a !important; }
    .d2h-code-line-ctn { color: #e0e0e0 !important; }
    .d2h-ins { background-color: rgba(74, 222, 128, 0.15) !important; }
    .d2h-ins .d2h-code-line-ctn { color: #a0f0b0 !important; }
    .d2h-del { background-color: rgba(244, 114, 182, 0.15) !important; }
    .d2h-del .d2h-code-line-ctn { color: #f0a0c0 !important; }
    .d2h-info { background: #2a2a4a !important; color: #888 !important; }
    .d2h-file-diff { border-color: #333 !important; }
    .d2h-code-linenumber {
      background: #1e1e3a !important;
      color: #666 !important;
      border-color: #333 !important;
    }
    .d2h-file-list-wrapper { display: none !important; }
    .d2h-tag {
      background: #2a2a4a !important;
      color: #aaa !important;
      border-color: #444 !important;
    }
  </style>
</head>
<body>

  <!-- ── Progress bar ──────────────────────────────── -->
  <div id="progress-bar-track" class="hidden">
    <div id="progress-bar-fill"></div>
  </div>

  <!-- ── Phase 1: Select ───────────────────────────── -->
  <div id="select-phase">
    <h1>setup-bench grading</h1>
    <div id="empty-message" class="hidden"></div>
    <select id="task-select"><option value="">Select task...</option></select>
    <select id="model-select" disabled><option value="">Select model...</option></select>
    <button id="start-btn" disabled>Start Grading</button>
  </div>

  <!-- ── Phase 2: Compare ──────────────────────────── -->
  <div id="compare-phase" class="hidden">
    <div class="progress-header">
      <span class="pair-label" id="pair-label">Pair 1 of 1</span>
      <span class="progress-pct" id="progress-pct">0%</span>
    </div>

    <div class="diff-columns">
      <div class="diff-side">
        <div class="side-header">
          <div class="label">A</div>
          <div class="proxy" id="proxy-left"></div>
        </div>
        <div class="diff-container" id="diff-left"></div>
      </div>
      <div class="diff-side">
        <div class="side-header">
          <div class="label">B</div>
          <div class="proxy" id="proxy-right"></div>
        </div>
        <div class="diff-container" id="diff-right"></div>
      </div>
    </div>

    <div class="action-bar">
      <span class="prompt">Which would you merge?</span>
      <button class="choice-btn" data-choice="A" onclick="choose('A')">A</button>
      <button class="choice-btn" data-choice="B" onclick="choose('B')">B</button>
      <button class="choice-btn" data-choice="tie" onclick="choose('tie')">Tie</button>
    </div>
    <div class="nav-hints">
      <span class="nav-hint"><kbd>&larr;</kbd> prev</span>
      <span class="nav-hint"><kbd>&rarr;</kbd> next</span>
      <span class="nav-hint"><kbd>R</kbd> rubric</span>
    </div>

    <div id="rubric-panel" class="hidden">
      <div class="rubric-field">
        <label>Correctness</label>
        <input type="text" id="rubric-correctness" placeholder="optional note">
      </div>
      <div class="rubric-field">
        <label>Minimality</label>
        <input type="text" id="rubric-minimality" placeholder="optional note">
      </div>
      <div class="rubric-field">
        <label>Readability</label>
        <input type="text" id="rubric-readability" placeholder="optional note">
      </div>
      <div class="rubric-field">
        <label>Over-engineering</label>
        <input type="text" id="rubric-overengineering" placeholder="optional note">
      </div>
    </div>
  </div>

  <!-- ── Phase 3: Reveal ───────────────────────────── -->
  <div id="reveal-phase" class="hidden">
    <h1 id="reveal-title">Results</h1>
    <h2>Summary</h2>
    <table class="reveal-table" id="summary-table">
      <thead><tr><th>Setup</th><th>Wins</th><th>Losses</th><th>Ties</th></tr></thead>
      <tbody></tbody>
    </table>
    <h2>Detail</h2>
    <table class="reveal-table" id="detail-table">
      <thead><tr><th>Pair</th><th>Left</th><th>Right</th><th>Choice</th></tr></thead>
      <tbody></tbody>
    </table>
    <button id="grade-another-btn" onclick="gradeAnother()">Grade Another</button>
  </div>

  <script src="/static/vendor/diff2html-ui.min.js"></script>
  <script>
    // ── State ──────────────────────────────────────────
    let state = {
      sessionId: null,
      pairs: [],
      currentIndex: 0,
      choices: {},
      taskId: null,
      model: null,
    };

    let tasksData = [];

    // ── DOM refs ───────────────────────────────────────
    const $selectPhase   = document.getElementById('select-phase');
    const $comparePhase  = document.getElementById('compare-phase');
    const $revealPhase   = document.getElementById('reveal-phase');
    const $taskSelect    = document.getElementById('task-select');
    const $modelSelect   = document.getElementById('model-select');
    const $startBtn      = document.getElementById('start-btn');
    const $emptyMessage  = document.getElementById('empty-message');
    const $pairLabel     = document.getElementById('pair-label');
    const $progressPct   = document.getElementById('progress-pct');
    const $progressTrack = document.getElementById('progress-bar-track');
    const $progressFill  = document.getElementById('progress-bar-fill');
    const $diffLeft      = document.getElementById('diff-left');
    const $diffRight     = document.getElementById('diff-right');
    const $proxyLeft     = document.getElementById('proxy-left');
    const $proxyRight    = document.getElementById('proxy-right');
    const $rubricPanel   = document.getElementById('rubric-panel');
    const $revealTitle   = document.getElementById('reveal-title');

    const $rubricCorrectness     = document.getElementById('rubric-correctness');
    const $rubricMinimality      = document.getElementById('rubric-minimality');
    const $rubricReadability     = document.getElementById('rubric-readability');
    const $rubricOverengineering = document.getElementById('rubric-overengineering');

    // ── Phase switching ────────────────────────────────
    function showPhase(phase) {
      $selectPhase.classList.toggle('hidden', phase !== 'select');
      $comparePhase.classList.toggle('hidden', phase !== 'compare');
      $revealPhase.classList.toggle('hidden', phase !== 'reveal');
      $progressTrack.classList.toggle('hidden', phase !== 'compare');
    }

    // ── Boot: load tasks ───────────────────────────────
    async function loadTasks() {
      try {
        const resp = await fetch('/api/tasks');
        tasksData = await resp.json();
      } catch (e) {
        tasksData = [];
      }

      if (tasksData.length === 0) {
        $emptyMessage.textContent = 'No grading-ready data. Run some trials first.';
        $emptyMessage.classList.remove('hidden');
        $taskSelect.classList.add('hidden');
        $modelSelect.classList.add('hidden');
        $startBtn.classList.add('hidden');
        return;
      }

      for (const t of tasksData) {
        const opt = document.createElement('option');
        opt.value = t.task_id;
        opt.textContent = t.task_id;
        $taskSelect.appendChild(opt);
      }
    }

    $taskSelect.addEventListener('change', () => {
      const taskId = $taskSelect.value;
      $modelSelect.innerHTML = '<option value="">Select model...</option>';
      $modelSelect.disabled = true;
      $startBtn.disabled = true;

      if (!taskId) return;

      const task = tasksData.find(t => t.task_id === taskId);
      if (!task) return;

      for (const m of task.models) {
        const opt = document.createElement('option');
        opt.value = m;
        opt.textContent = m;
        $modelSelect.appendChild(opt);
      }
      $modelSelect.disabled = false;
    });

    $modelSelect.addEventListener('change', () => {
      $startBtn.disabled = !$modelSelect.value;
    });

    $startBtn.addEventListener('click', startGrading);

    // ── Start grading ──────────────────────────────────
    async function startGrading() {
      const taskId = $taskSelect.value;
      const model  = $modelSelect.value;
      if (!taskId || !model) return;

      $startBtn.disabled = true;
      $startBtn.textContent = 'Loading...';

      try {
        const resp = await fetch(`/api/pairs?task=${encodeURIComponent(taskId)}&model=${encodeURIComponent(model)}`);
        if (!resp.ok) {
          const err = await resp.json().catch(() => ({ detail: 'Request failed' }));
          alert(err.detail || 'Failed to load pairs');
          $startBtn.disabled = false;
          $startBtn.textContent = 'Start Grading';
          return;
        }
        const data = await resp.json();
        state.sessionId = data.session_id;
        state.taskId    = data.task_id;
        state.model     = data.model;
        state.pairs     = data.pairs;
        state.currentIndex = 0;
        state.choices   = {};

        showPhase('compare');
        renderPair(0);
      } catch (e) {
        alert('Network error: ' + e.message);
      } finally {
        $startBtn.disabled = false;
        $startBtn.textContent = 'Start Grading';
      }
    }

    // ── Render a pair ──────────────────────────────────
    function renderPair(index) {
      const pair  = state.pairs[index];
      const total = pair.total_pairs;

      // Progress
      const pct = Math.round(((index + 1) / total) * 100);
      $pairLabel.textContent = `Pair ${index + 1} of ${total}`;
      $progressPct.textContent = `${pct}%`;
      $progressFill.style.width = `${pct}%`;

      // Proxy stats
      $proxyLeft.textContent  = formatProxy(pair.left.proxy);
      $proxyRight.textContent = formatProxy(pair.right.proxy);

      // Diffs
      renderDiff($diffLeft, pair.left.diff);
      renderDiff($diffRight, pair.right.diff);

      // Highlight stored choice
      clearChoiceHighlight();
      const stored = state.choices[index];
      if (stored) {
        highlightChoice(stored.choice);
      }

      // Restore or clear rubric
      if (stored && stored.rubric) {
        $rubricCorrectness.value     = stored.rubric.correctness || '';
        $rubricMinimality.value      = stored.rubric.minimality || '';
        $rubricReadability.value     = stored.rubric.readability || '';
        $rubricOverengineering.value = stored.rubric.overengineering || '';
      } else {
        $rubricCorrectness.value     = '';
        $rubricMinimality.value      = '';
        $rubricReadability.value     = '';
        $rubricOverengineering.value = '';
      }
    }

    function formatProxy(p) {
      return `+${p.lines_added} -${p.lines_removed} | ${p.files_touched} file${p.files_touched !== 1 ? 's' : ''}`;
    }

    function renderDiff(container, diffString) {
      if (!diffString || diffString.trim() === '') {
        container.innerHTML = '<div class="no-changes">No changes</div>';
        return;
      }
      const diffHtml = Diff2Html.html(diffString, {
        drawFileList: false,
        matching: 'lines',
        outputFormat: 'line-by-line',
        renderNothingWhenEmpty: false,
      });
      container.innerHTML = diffHtml;
    }

    // ── Choice logic ───────────────────────────────────
    let advanceTimer = null;

    function choose(choice) {
      if (advanceTimer) {
        clearTimeout(advanceTimer);
        advanceTimer = null;
      }

      const rubric = collectRubric();

      state.choices[state.currentIndex] = { choice, rubric };

      clearChoiceHighlight();
      highlightChoice(choice);
      flashChoice(choice);

      // Fire-and-forget POST
      fetch('/api/judge', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          session_id: state.sessionId,
          pair_index: state.currentIndex,
          choice: choice,
          rubric_correctness: rubric.correctness || null,
          rubric_minimality: rubric.minimality || null,
          rubric_readability: rubric.readability || null,
          rubric_overengineering: rubric.overengineering || null,
        }),
      }).catch(() => {});

      // Auto-advance after 200ms
      advanceTimer = setTimeout(() => {
        advanceTimer = null;
        if (state.currentIndex >= state.pairs.length - 1) {
          fetchReveal();
        } else {
          state.currentIndex++;
          renderPair(state.currentIndex);
        }
      }, 200);
    }

    function advance() {
      if (!state.choices[state.currentIndex]) return;
      if (advanceTimer) {
        clearTimeout(advanceTimer);
        advanceTimer = null;
      }
      if (state.currentIndex < state.pairs.length - 1) {
        state.currentIndex++;
        renderPair(state.currentIndex);
      } else {
        fetchReveal();
      }
    }

    function goBack() {
      if (state.currentIndex > 0) {
        if (advanceTimer) {
          clearTimeout(advanceTimer);
          advanceTimer = null;
        }
        state.currentIndex--;
        renderPair(state.currentIndex);
      }
    }

    function clearChoiceHighlight() {
      document.querySelectorAll('.choice-btn').forEach(btn => {
        btn.classList.remove('active', 'flash-a', 'flash-b', 'flash-tie');
      });
    }

    function highlightChoice(choice) {
      const btn = document.querySelector(`.choice-btn[data-choice="${choice}"]`);
      if (btn) btn.classList.add('active');
    }

    function flashChoice(choice) {
      const btn = document.querySelector(`.choice-btn[data-choice="${choice}"]`);
      if (!btn) return;
      const cls = 'flash-' + (choice === 'A' ? 'a' : choice === 'B' ? 'b' : 'tie');
      btn.classList.add(cls);
      setTimeout(() => btn.classList.remove(cls), 200);
    }

    // ── Rubric ─────────────────────────────────────────
    function toggleRubric() {
      $rubricPanel.classList.toggle('hidden');
      if (!$rubricPanel.classList.contains('hidden')) {
        $rubricCorrectness.focus();
      }
    }

    function hideRubric() {
      $rubricPanel.classList.add('hidden');
    }

    function collectRubric() {
      return {
        correctness:     $rubricCorrectness.value.trim(),
        minimality:      $rubricMinimality.value.trim(),
        readability:     $rubricReadability.value.trim(),
        overengineering: $rubricOverengineering.value.trim(),
      };
    }

    // ── Reveal ─────────────────────────────────────────
    async function fetchReveal() {
      try {
        const resp = await fetch(`/api/reveal?session_id=${encodeURIComponent(state.sessionId)}`);
        const data = await resp.json();
        showReveal(data);
      } catch (e) {
        alert('Failed to load results: ' + e.message);
      }
    }

    function showReveal(data) {
      $revealTitle.textContent = `Results — ${state.taskId} / ${state.model}`;

      // Summary table sorted by wins desc
      const summaryBody = document.querySelector('#summary-table tbody');
      summaryBody.innerHTML = '';
      const entries = Object.entries(data.summary).sort((a, b) => b[1].wins - a[1].wins);
      for (const [setup, rec] of entries) {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${esc(setup)}</td><td>${rec.wins}</td><td>${rec.losses}</td><td>${rec.ties}</td>`;
        summaryBody.appendChild(tr);
      }

      // Detail table
      const detailBody = document.querySelector('#detail-table tbody');
      detailBody.innerHTML = '';
      for (const p of data.pairs) {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${p.pair_index}</td><td>${esc(p.left_setup_id)}</td><td>${esc(p.right_setup_id)}</td><td>${esc(p.choice || '—')}</td>`;
        detailBody.appendChild(tr);
      }

      showPhase('reveal');
    }

    function esc(s) {
      const d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    function gradeAnother() {
      state = {
        sessionId: null,
        pairs: [],
        currentIndex: 0,
        choices: {},
        taskId: null,
        model: null,
      };
      $taskSelect.value = '';
      $modelSelect.innerHTML = '<option value="">Select model...</option>';
      $modelSelect.disabled = true;
      $startBtn.disabled = true;
      hideRubric();
      showPhase('select');
    }

    // ── Keyboard handling ──────────────────────────────
    document.addEventListener('keydown', (e) => {
      if ($comparePhase.classList.contains('hidden')) return;

      const tag = document.activeElement.tagName;
      if (tag === 'INPUT' || tag === 'TEXTAREA') {
        if (e.key === 'Escape') {
          hideRubric();
          document.activeElement.blur();
        }
        return;
      }

      switch (e.key) {
        case 'a': case 'A': case '1': choose('A'); break;
        case 'b': case 'B': case '2': choose('B'); break;
        case 't': case 'T': case '3': choose('tie'); break;
        case 'ArrowRight': case 'Enter': advance(); break;
        case 'ArrowLeft':  goBack(); break;
        case 'r': case 'R': toggleRubric(); break;
        case 'Escape': hideRubric(); break;
      }
    });

    // ── Init ───────────────────────────────────────────
    loadTasks();
  </script>
</body>
</html>
